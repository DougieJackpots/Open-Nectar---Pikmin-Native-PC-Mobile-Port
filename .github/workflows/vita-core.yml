name: Vita compilation (experimental)
on:
  workflow_dispatch:
    inputs:
      build_game:
        description: Build an unvalidated developer VPK after the core checks
        type: boolean
        default: false
  push:
    branches: ['vita/shader-diagnostics', 'vita/native-renderer-rework']
  pull_request:
    paths: ['games/pikmin1/**', 'libs/**', 'scripts/build-vita-core.sh', '.github/workflows/vita-core.yml']
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler cache
        run: sudo apt-get update -qq && sudo apt-get install -y ccache
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-vita-ccache-v1-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vita-ccache-v1-${{ github.job }}-
      - name: Configure compiler cache
        run: |
          ccache --set-config=max_size=500M
          ccache --set-config=compiler_check=content
          ccache --zero-stats
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Test Vita memory bounds on the host
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Igames/pikmin1/pc_port/vita/tests -Igames/pikmin1/pc_port \
            games/pikmin1/pc_port/vita/pc_host_readable_vita.cpp \
            games/pikmin1/pc_port/vita/pc_host_readable_vita_test.cpp \
            -o "$RUNNER_TEMP/vita-memory-test"
          "$RUNNER_TEMP/vita-memory-test"
      - name: Test native Cg generation and matrix convention
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            games/pikmin1/pc_port/vita/pc_vita_cg_test.cpp \
            -o "$RUNNER_TEMP/vita-cg-test"
          "$RUNNER_TEMP/vita-cg-test"
      - name: Test single-player feature gate
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -DPIKI_SINGLE_PLAYER_ONLY=1 \
            -Igames/pikmin1/pc_port \
            games/pikmin1/pc_port/vita/pc_coop_singleplayer.cpp \
            games/pikmin1/pc_port/vita/pc_singleplayer_test.cpp \
            -o "$RUNNER_TEMP/vita-singleplayer-test"
          "$RUNNER_TEMP/vita-singleplayer-test"
      - name: Restore VitaSDK and dependency installation
        id: vita-sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vita-sdk
          key: ${{ runner.os }}-vita-sdk-20261015-v1-${{ github.job }}-${{ hashFiles('scripts/build-vita-deps.sh') }}
      - name: Set SDK path
        run: echo "VITASDK=$RUNNER_TEMP/vita-sdk/vitasdk" >> "$GITHUB_ENV"
      - name: Install pinned VitaSDK
        if: steps.vita-sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          archive=vitasdk-x86_64-linux-gnu-2026-10-15_05-01-16.tar.bz2
          curl --fail --location --retry 3 \
            "https://github.com/vitasdk/autobuilds/releases/download/sdk-snapshot-20261015.850.1/$archive" \
            -o "$RUNNER_TEMP/$archive"
          echo "801f483928523fe63547faf58a7dfdaca7482b26c33af0064acea96a906f7662  $RUNNER_TEMP/$archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/vita-sdk"
          tar -xjf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/vita-sdk"
          echo "VITASDK=$RUNNER_TEMP/vita-sdk/vitasdk" >> "$GITHUB_ENV"
      - name: Cross-compile Pikmin 1 logic and OS
        run: bash scripts/build-vita-core.sh -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
      - name: Preserve developer archives
        uses: actions/upload-artifact@v4
        with:
          name: pikmin1-vita-core-not-playable
          path: |
            build-vita-core/libpikmin_legacy.a
            build-vita-core/libpikmin_vita_os.a
          if-no-files-found: error

  experimental-package:
    if: (github.event_name == 'workflow_dispatch' && inputs.build_game) || (github.event_name == 'push' && (github.ref == 'refs/heads/vita/shader-diagnostics' || github.ref == 'refs/heads/vita/native-renderer-rework'))
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler cache
        run: sudo apt-get update -qq && sudo apt-get install -y ccache
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-vita-ccache-v1-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vita-ccache-v1-${{ github.job }}-
      - name: Configure compiler cache
        run: |
          ccache --set-config=max_size=500M
          ccache --set-config=compiler_check=content
          ccache --zero-stats
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Restore VitaSDK and dependency installation
        id: vita-sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vita-sdk
          key: ${{ runner.os }}-vita-sdk-20261015-v1-${{ github.job }}-${{ hashFiles('scripts/build-vita-deps.sh') }}
      - name: Set SDK path
        run: echo "VITASDK=$RUNNER_TEMP/vita-sdk/vitasdk" >> "$GITHUB_ENV"
      - name: Install pinned VitaSDK
        if: steps.vita-sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          archive=vitasdk-x86_64-linux-gnu-2026-10-15_05-01-16.tar.bz2
          curl --fail --location --retry 3 \
            "https://github.com/vitasdk/autobuilds/releases/download/sdk-snapshot-20261015.850.1/$archive" \
            -o "$RUNNER_TEMP/$archive"
          echo "801f483928523fe63547faf58a7dfdaca7482b26c33af0064acea96a906f7662  $RUNNER_TEMP/$archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/vita-sdk"
          tar -xjf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/vita-sdk"
          echo "VITASDK=$RUNNER_TEMP/vita-sdk/vitasdk" >> "$GITHUB_ENV"
      - name: Build SDL vitaGL dependencies
        if: steps.vita-sdk-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-vita-deps.sh
      - name: Link and package experimental runtime
        run: bash scripts/build-vita-game.sh -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4
        with:
          name: pikmin1-vita-experimental-unvalidated
          path: |
            build-vita-game/pikmin1-vita-experimental.vpk
            build-vita-game/bin/nectar
            build-vita-game/pikmin_pc.velf
          if-no-files-found: error
